name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --no-editable
      - name: Build local synthetic fixtures
        run: |
          PYTHONPATH=src:. .venv/bin/python scripts/build_phase2_fixture_bundle.py
          PYTHONPATH=src:. .venv/bin/python scripts/build_phase2_fixture_attempts.py
          PYTHONPATH=src:. .venv/bin/python scripts/build_phase2_old_origin_attempts.py
      - name: Run secret-free fixture tests
        run: PYTHONPATH=src:. .venv/bin/python -m unittest discover -s tests
