name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --no-editable
      - name: Lint
        run: .venv/bin/ruff check src scripts tests
      - name: Type check
        run: .venv/bin/mypy
      - name: Build local synthetic fixtures
        run: |
          PYTHONPATH=src:. .venv/bin/python scripts/fixtures/build_phase2_fixture_bundle.py
          PYTHONPATH=src:. .venv/bin/python scripts/fixtures/build_phase2_fixture_attempts.py
          PYTHONPATH=src:. .venv/bin/python scripts/fixtures/build_phase2_old_origin_attempts.py
      - name: Run secret-free fixture tests
        run: PYTHONPATH=src:. .venv/bin/python -m unittest discover -s tests
