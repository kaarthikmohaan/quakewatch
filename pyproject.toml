[project]
name = "quakewatch"
version = "0.1.0"
description = "Batch data warehouse for historical USGS earthquake records"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "snowflake-connector-python>=4.7.5",
]

[project.scripts]
quakewatch-extract = "quakewatch.extract_batch:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
